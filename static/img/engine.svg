<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" fill="none">
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.5">
    <!-- Main engine block -->
    <rect x="18" y="20" width="72" height="38" rx="5"/>
    <!-- Left intake T-pipe -->
    <line x1="18" y1="30" x2="6" y2="30"/>
    <line x1="6" y1="24" x2="6" y2="54"/>
    <line x1="6" y1="54" x2="18" y2="54"/>
    <!-- Top chimney -->
    <line x1="40" y1="20" x2="40" y2="10"/>
    <line x1="32" y1="10" x2="50" y2="10"/>
    <line x1="48" y1="20" x2="48" y2="12"/>
    <!-- Right exhaust wave -->
    <path d="M90,28 C100,28 100,39 90,39 C100,39 100,50 90,50" stroke-width="5.5"/>
    <!-- Bottom connector left -->
    <line x1="30" y1="58" x2="30" y2="70"/>
    <line x1="24" y1="70" x2="40" y2="70"/>
    <!-- Bottom connector right -->
    <line x1="58" y1="58" x2="58" y2="70"/>
    <line x1="52" y1="70" x2="68" y2="70"/>
  </g>
</svg>
